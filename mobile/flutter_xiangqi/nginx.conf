server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bật gzip để tăng tốc load
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/wasm
        image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets lâu dài (Flutter đặt hash vào tên file)
    location ~* \.(js|css|wasm|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Không cache index.html và service worker
    location ~* (index\.html|flutter_service_worker\.js|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Flutter Web là SPA — mọi route đều trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check cho Railway
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
