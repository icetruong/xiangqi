{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cờ Tướng — Mất kết nối</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'games/img/favicon.svg' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse at 50% 40%, #4b2416 0%, #2a120b 70%),
                #0a0503;
            color: #f0e6d0;
        }
        .card {
            text-align: center;
            padding: 48px 36px;
            max-width: 380px;
            width: 90vw;
            background: linear-gradient(165deg, #3a1c0e 0%, #2b1308 50%, #1e0d06 100%);
            border: 2px solid #7a5a28;
            outline: 1px solid #c9944a;
            outline-offset: -6px;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        .hanzi {
            font-size: 5rem;
            line-height: 1;
            color: #8b1a1a;
            text-shadow: 0 0 20px rgba(139,26,26,0.5);
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.3rem;
            letter-spacing: 0.1em;
            color: #f5e6c8;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        p {
            font-size: 0.9rem;
            color: #a07850;
            line-height: 1.6;
            margin-bottom: 28px;
            font-style: italic;
        }
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #c9944a, transparent);
            margin-bottom: 28px;
        }
        a {
            display: inline-block;
            padding: 12px 28px;
            background: linear-gradient(160deg, #7a1c10 0%, #5a1209 100%);
            color: #f5e0c0;
            text-decoration: none;
            border: 1px solid #a83020;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 0.06em;
            transition: filter 0.15s;
        }
        a:hover { filter: brightness(1.2); }
    </style>
</head>
<body>
    <div class="card">
        <div class="hanzi">無網</div>
        <h1>Mất kết nối</h1>
        <div class="divider"></div>
        <p>Giang hồ tạm thời vắng lặng —<br>
        không thể kết nối máy chủ lúc này.</p>
        <a href="/" onclick="location.reload()">Thử lại</a>
    </div>
</body>
</html>
